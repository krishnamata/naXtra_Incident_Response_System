{# app/templates/pre_approve_user.html #}
{% extends "base.html" %}

{% block content %}
  <h2>Pre-Approve User: {{ user.username }}</h2>
  <form method="POST" action="{{ url_for('auth.pre_approve_user', user_id=user.id) }}">
    <div class="form-group">
      <label for="office_email">Office Email</label>
      <input type="email" class="form-control" name="office_email" id="office_email" required>
    </div>

    <div class="form-group">
      <label for="contact_number">Contact Number</label>
      <input type="text" class="form-control" name="contact_number" id="contact_number" required>
    </div>

    <div class="form-group">
      <label for="created_at">Created At</label>
      <input type="datetime-local" class="form-control" name="created_at" id="created_at" required value="{{ now }}">
    </div>

    <button type="submit" class="btn btn-success">Submit and Approve</button>
    <a href="{{ url_for('auth.pending_users') }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
