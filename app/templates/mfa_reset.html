<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset MFA - naXtra Pulse IR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3">MFA Reset for {{ username }}</h3>
            <p>Scan this new QR code with your authenticator app to set up MFA again:</p>
            <img src="data:image/png;base64,{{ qr_code }}" 
                 alt="MFA QR Code" 
                 class="mb-3 border rounded" 
                 style="max-width: 200px;">
            <form method="get" action="{{ url_for('auth.login') }}">
                <button type="submit" class="btn btn-primary w-100">Back to Login</button>
            </form>
        </div>
    </div>
</body>
</html>
